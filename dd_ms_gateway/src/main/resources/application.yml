spring:
  application:
    name: dd-ms-gateway       # guiones: es el nombre en Consul

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: "optional:consul:"

  cloud:
    gateway:
      server:
        webflux:
          # CORS para la consola Angular (dd_front) cuando se sirve desde su
          # propio origen. En desarrollo el dev-server de Angular hace proxy a
          # este puerto, asi que el navegador no manda peticiones cruzadas y
          # esta configuracion no estorba; en produccion, ajusta la lista con
          # CORS_ALLOWED_ORIGINS. Nunca uses "*" junto con credenciales.
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
                allowedMethods: [ GET, POST, PUT, PATCH, DELETE, OPTIONS ]
                allowedHeaders: [ Authorization, Content-Type, Accept, Origin ]
                exposedHeaders: [ Content-Disposition ]
                maxAge: 3600

          routes:
            - id: auth
              uri: lb://dd-ms-auth
              predicates:
                - Path=/api/auth/**

            - id: crm
              uri: lb://dd-ms-crm
              predicates:
                - Path=/api/crm/**,/api/plans/**,/api/contracts/**

            - id: billing
              uri: lb://dd-ms-billing
              predicates:
                - Path=/api/billing/**,/api/payments/**

            - id: network
              uri: lb://dd-ms-network
              predicates:
                - Path=/api/network/**,/api/gpon/**,/api/inventory/**,/api/coverage/**

            - id: support
              uri: lb://dd-ms-support
              predicates:
                - Path=/api/tickets/**,/api/technicians/**

            - id: comms
              uri: lb://dd-ms-comms
              predicates:
                - Path=/api/whatsapp/**,/api/ai/**

            - id: reports
              uri: lb://dd-ms-reports
              predicates:
                - Path=/api/reports/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
