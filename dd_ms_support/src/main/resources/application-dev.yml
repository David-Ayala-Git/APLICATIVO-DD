spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/ddconexiones
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:devpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: support
    open-in-view: false

  flyway:
    enabled: true
    schemas: support
    default-schema: support
    locations: classpath:db/migration

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      discovery:
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s

server:
  port: 8085
