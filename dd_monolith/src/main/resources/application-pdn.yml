spring:
  datasource:
    # DB_URL completa (Supabase: incluye ?sslmode=require); si falta, se arma con DB_HOST
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ddconexiones}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:${SERVER_PORT:8080}}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  bootstrap:
    require-rotation: true
    super-admin-password: ${SUPER_ADMIN_PASSWORD:}

network:
  crypto:
    secret: ${NETWORK_CRYPTO_SECRET}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

whatsapp:
  token: ${WHATSAPP_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
