spring:
  application:
    name: dd-monolith

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Flyway lo ejecuta MonolithFlywayConfig por separado en los 7 esquemas
  flyway:
    enabled: false

  cloud:
    discovery:
      client:
        simple:
          instances:
            "[dd-ms-auth]":
              - uri: http://localhost:${PORT:${SERVER_PORT:8080}}
            "[dd-ms-crm]":
              - uri: http://localhost:${PORT:${SERVER_PORT:8080}}
            "[dd-ms-billing]":
              - uri: http://localhost:${PORT:${SERVER_PORT:8080}}
            "[dd-ms-network]":
              - uri: http://localhost:${PORT:${SERVER_PORT:8080}}
            "[dd-ms-support]":
              - uri: http://localhost:${PORT:${SERVER_PORT:8080}}
            "[dd-ms-comms]":
              - uri: http://localhost:${PORT:${SERVER_PORT:8080}}
            "[dd-ms-reports]":
              - uri: http://localhost:${PORT:${SERVER_PORT:8080}}

monolith:
  flyway:
    enabled: true
    connect-retries: 12
    connect-retries-interval: 5

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

billing:
  einvoice:
    provider: ${BILLING_EINVOICE_PROVIDER:none}
  payments:
    provider: ${BILLING_PAYMENTS_PROVIDER:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

keep-alive:
  enabled: ${KEEP_ALIVE_ENABLED:false}
  url: ${KEEP_ALIVE_URL:}
  interval-ms: ${KEEP_ALIVE_INTERVAL:720000}
  timeout-ms: ${KEEP_ALIVE_TIMEOUT:15000}
