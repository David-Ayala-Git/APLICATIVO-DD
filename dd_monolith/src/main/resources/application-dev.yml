spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ddconexiones}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:devpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:${SERVER_PORT:8080}}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-ddconexiones-not-for-production-use-only-1234567890}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  bootstrap:
    require-rotation: false
    super-admin-password: ${SUPER_ADMIN_PASSWORD:}

network:
  crypto:
    secret: ${NETWORK_CRYPTO_SECRET:dev-network-crypto-key-ddconexiones-not-for-production-1234567890}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

whatsapp:
  token: ${WHATSAPP_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
