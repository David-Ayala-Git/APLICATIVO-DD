spring:
  datasource:
    url: 'jdbc:h2:mem:monolith_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS auth\;CREATE SCHEMA IF NOT EXISTS crm\;CREATE SCHEMA IF NOT EXISTS billing\;CREATE SCHEMA IF NOT EXISTS network\;CREATE SCHEMA IF NOT EXISTS support\;CREATE SCHEMA IF NOT EXISTS comms\;CREATE SCHEMA IF NOT EXISTS reports'
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

monolith:
  flyway:
    enabled: false

security:
  jwt:
    secret: test-secret-key-ddconexiones-monolith-at-least-64-characters-long-123456
    expiration-seconds: 3600
  bootstrap:
    require-rotation: false
    super-admin-password: ''

network:
  crypto:
    secret: test-network-crypto-key-ddconexiones-monolith-1234567890

cors:
  allowed-origins: https://*.vercel.app,http://localhost:4200
