plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dd.conexiones'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	mavenLocal()
}

ext {
	set('springCloudVersion', "2025.1.3")
}

configurations.configureEach {
	// El monolito corre en una sola JVM sin Consul; los clientes @LoadBalanced
	// resuelven servicios contra localhost mediante SimpleDiscoveryClient.
	exclude group: 'org.springframework.cloud', module: 'spring-cloud-starter-consul-config'
	exclude group: 'org.springframework.cloud', module: 'spring-cloud-starter-consul-discovery'
	exclude group: 'org.springframework.cloud', module: 'spring-cloud-consul-config'
	exclude group: 'org.springframework.cloud', module: 'spring-cloud-consul-discovery'
	exclude group: 'org.springframework.cloud', module: 'spring-cloud-consul-core'
}

dependencies {
	implementation 'dd.conexiones:ms-common:1.0.0'
	implementation 'dd.conexiones:dd_ms_auth:0.0.1-SNAPSHOT'
	implementation 'dd.conexiones:dd_ms_crm:0.0.1-SNAPSHOT'
	implementation 'dd.conexiones:dd_ms_billing:0.0.1-SNAPSHOT'
	implementation 'dd.conexiones:dd_ms_network:0.0.1-SNAPSHOT'
	implementation 'dd.conexiones:dd_ms_support:0.0.1-SNAPSHOT'
	implementation 'dd.conexiones:dd_ms_comms:0.0.1-SNAPSHOT'
	implementation 'dd.conexiones:dd_ms_reports:0.0.1-SNAPSHOT'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

// Empaqueta las migraciones Flyway de cada microservicio bajo db/monolith/<esquema>/
// para que no colisionen los archivos V1__*.sql en classpath:db/migration.
def monolithSchemas = ['auth', 'crm', 'billing', 'network', 'support', 'comms', 'reports']
def generatedMigrationsDir = layout.buildDirectory.dir('generated-resources/monolith-migrations')

def copyMonolithMigrations = tasks.register('copyMonolithMigrations', Copy) {
	into generatedMigrationsDir
	monolithSchemas.each { schema ->
		from("../dd_ms_${schema}/src/main/resources/db/migration") {
			into "db/monolith/${schema}"
		}
	}
}

sourceSets.main.resources.srcDir(generatedMigrationsDir)
tasks.named('processResources') {
	dependsOn copyMonolithMigrations
}

tasks.named('test') {
	useJUnitPlatform()
}
