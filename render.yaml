# Blueprint de Render (New > Blueprint > repo APLICATIVO-DD, rama main).
# Un solo Web Service en plan FREE (512 MB RAM): el Dockerfile de la raiz compila
# dd_monolith (los 7 dominios + seguridad/CORS en una unica JVM) y escucha en PORT=10000.
#
# Variables: el mismo .env de siempre (ver .env.example). En el servicio:
# Environment > "Add from .env" y pegarlo. Las de "sync: false" se piden al
# crear el Blueprint.

services:
  - type: web
    name: aplicativo-dd
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon            # crea Supabase en la region mas cercana (West US)
    plan: free                # 512 MB RAM (suficiente para 1 JVM unificada)
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - Dockerfile
        - settings.gradle
        - build.gradle
        - gradle/**
        - ms-common/**
        - dd_ms_*/**
        - dd_monolith/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: pdn,render
      - key: PORT
        value: "10000"
      # Supabase > Connect > Session pooler (infra/supabase/README.md)
      - key: DB_URL             # jdbc:postgresql://<host>.pooler.supabase.com:5432/postgres?sslmode=require
        sync: false
      - key: DB_USER            # postgres.<ref-del-proyecto>
        sync: false
      - key: DB_PASSWORD
        sync: false
      # 1 sola JVM: 5 conexiones caben holgadamente en el pool de 15 de Supabase Free
      - key: DB_POOL_SIZE
        value: "5"
      - key: JWT_SECRET         # 64+ caracteres
        sync: false
      - key: NETWORK_CRYPTO_SECRET
        sync: false
      - key: SUPER_ADMIN_PASSWORD   # 12+ caracteres; obligatorio en el primer arranque
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      # Keep-Alive para reducir suspension por inactividad en Render (12 min = 720000 ms)
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_URL
        value: https://aplicativo-dd.onrender.com/health
      - key: KEEP_ALIVE_INTERVAL
        value: "720000"
