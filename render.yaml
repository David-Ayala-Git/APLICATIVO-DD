# Blueprint de Render (New > Blueprint > repo APLICATIVO-DD, rama main).
# Un solo Web Service con TODO el ecosistema: el Dockerfile de la raiz compila
# ms-common + 8 microservicios y entrypoint.sh los arranca juntos. Solo el
# api-gateway queda expuesto, en PORT=10000.
#
# Variables: el mismo .env de siempre (ver .env.example). En el servicio:
# Environment > "Add from .env" y pegarlo. Las de "sync: false" se piden al
# crear el Blueprint.

services:
  - type: web
    name: aplicativo-dd
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon            # crea Supabase en la region mas cercana (West US)
    # Probado en local: los 8 servicios en reposo usan ~1.4 GB. Con "free" o
    # "starter" (512 MB) el contenedor muere por falta de memoria al arrancar.
    # Si en uso real aparece OutOfMemory en los logs, sube a "pro" (4 GB).
    plan: standard            # 2 GB
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - Dockerfile
        - entrypoint.sh
        - settings.gradle
        - build.gradle
        - gradle/**
        - ms-common/**
        - dd_ms_*/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: pdn,render
      - key: PORT
        value: "10000"
      # Supabase > Connect > Session pooler (infra/supabase/README.md)
      - key: DB_URL             # jdbc:postgresql://<host>.pooler.supabase.com:5432/postgres?sslmode=require
        sync: false
      - key: DB_USER            # postgres.<ref-del-proyecto>
        sync: false
      - key: DB_PASSWORD
        sync: false
      # 7 servicios x 2 = 14 conexiones: cabe en el pool de 15 del plan gratis de Supabase
      - key: DB_POOL_SIZE
        value: "2"
      - key: JWT_SECRET         # 64+ caracteres
        sync: false
      - key: NETWORK_CRYPTO_SECRET
        sync: false
      - key: SUPER_ADMIN_PASSWORD   # 12+ caracteres; obligatorio en el primer arranque
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
