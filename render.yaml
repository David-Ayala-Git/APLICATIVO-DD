# Blueprint de Render: New > Blueprint > repo APLICATIVO-DD (rama main).
# Crea los 8 microservicios como Web Services con Docker. Render no ejecuta
# docker-compose: construye cada uno con su Dockerfile.
#
# VARIABLES: todas salen de UN SOLO .env (ver .env.example).
#   1. Dashboard > Environment Groups > New "dd-env" > Add from .env > pegar .env
#   2. En cada servicio: Environment > Link Environment Group > dd-env
# Todos escuchan en el puerto que Render pone por defecto (PORT=10000), por eso
# el mismo .env sirve para los 8 (AUTH_HOSTPORT=dd-ms-auth:10000, etc.).

services:
  - type: web
    name: dd-ms-gateway
    runtime: docker
    region: virginia
    plan: starter
    dockerfilePath: ./dd_ms_gateway/Dockerfile
    dockerContext: ./dd_ms_gateway   # no usa ms-common
    buildFilter:
      paths: [ "dd_ms_gateway/**" ]
    healthCheckPath: /actuator/health

  - type: web
    name: dd-ms-auth
    runtime: docker
    region: virginia
    plan: starter
    dockerfilePath: ./dd_ms_auth/Dockerfile
    dockerContext: .                 # raiz: el Dockerfile necesita ms-common
    buildFilter:
      paths: [ "dd_ms_auth/**", "ms-common/**" ]

  - type: web
    name: dd-ms-crm
    runtime: docker
    region: virginia
    plan: starter
    dockerfilePath: ./dd_ms_crm/Dockerfile
    dockerContext: .                 # raiz: el Dockerfile necesita ms-common
