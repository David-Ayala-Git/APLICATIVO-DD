      - fromGroup: dd-shared
      - key: PORT
        value: "8087"
      - key: DB_URL             # jdbc:postgresql://<pooler>.pooler.supabase.com:5432/postgres?sslmode=require
        sync: false
      - key: DB_USER            # postgres.<ref-del-proyecto>
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CRM_HOSTPORT
        fromService: { type: pserv, name: dd-ms-crm, property: hostport }
