spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/ddconexiones
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:devpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: comms
    open-in-view: false

  flyway:
    enabled: true
    schemas: comms
    default-schema: comms
    locations: classpath:db/migration

  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      discovery:
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s

server:
  port: 8086

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

whatsapp:
  token: ${WHATSAPP_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:dev-verify-token}
