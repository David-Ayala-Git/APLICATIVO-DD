spring:
  application:
    name: dd-ms-network       # guiones: es el nombre en Consul

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: "optional:consul:"

  # Postgres puede no aceptar conexiones aun cuando arranca el servicio (compose,
  # Railway, reinicio del servidor): Flyway reintenta en vez de tumbar el arranque.
  flyway:
    connect-retries: 12
    connect-retries-interval: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
